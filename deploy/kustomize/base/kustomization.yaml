apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml

# Common labels applied to all generated resources.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: acme-gateway
      app.kubernetes.io/component: gateway
