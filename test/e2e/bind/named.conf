// BIND configuration for ACME dns-01 testing
// Allows dynamic updates for TXT record management via nsupdate

options {
  directory "/var/lib/bind";
  allow-recursion { any; };
  listen-on { any; };
  listen-on-v6 { any; };
  
  // Allow dynamic updates from any (for nsupdate from docker exec)
  allow-update { any; };
};

zone "pebble-test.local" {
  type master;
  file "/etc/bind/zones/pebble-test.local.zone";
  allow-update { any; };
};

zone "localhost" {
  type master;
  file "/etc/bind/zones/localhost.zone";
};

zone "127.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/127.in-addr.arpa.zone";
};
