apiVersion: v1
kind: Service
metadata:
  name: acme-gateway
spec:
  # LoadBalancer exposes the ACME endpoint directly on port 443.
  # Overlays may patch this to ClusterIP + Ingress (TCP passthrough) if preferred.
  type: LoadBalancer
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: acme-gateway
