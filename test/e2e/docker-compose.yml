# Pebble: Let's Encrypt's lightweight ACME CA for integration testing.
#
# PEBBLE_VA_ALWAYS_VALID=1 skips actual HTTP/DNS challenge validation so tests
# can exercise the full ACME protocol flow without a real public endpoint.
# Never use this mode against any environment other than local testing.

networks:
  pebble-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

services:
  # BIND DNS server for dns-01 validation testing (TestPebbleDNS01).
  # Set PEBBLE_VA_ALWAYS_VALID=0 to enable real DNS validation.
  bind:
    build:
      context: ./bind
      dockerfile: Dockerfile
    networks:
      pebble-test:
        ipv4_address: 172.25.0.10
    environment:
      TZ: UTC

  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    ports:
      - "14000:14000"  # ACME directory (TLS)
      - "15000:15000"  # Management API – root CA cert available at /roots/0
    networks:
      pebble-test:
    dns:
      - 172.25.0.10  # BIND server IP for dns-01 validation
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_VA_ALWAYS_VALID: ${PEBBLE_VA_ALWAYS_VALID:-1}
    command: ["-dnsserver", "172.25.0.10:53"]
    # For dns-01 tests (TestPebbleDNS01), set PEBBLE_VA_ALWAYS_VALID=0
    # and Pebble will query 172.25.0.10:53 (BIND) for DNS validation
    depends_on:
      - bind
