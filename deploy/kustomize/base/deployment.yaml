apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-gateway
spec:
  replicas: 1
  # Recreate is required: acme-gateway uses SQLite (single-writer).
  # A RollingUpdate would run two Pods simultaneously, causing database lock errors.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: acme-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acme-gateway
    spec:
      serviceAccountName: acme-gateway
      # fsGroup 100 matches the 'acme' system group in the container image
      # (Alpine addgroup -S assigns GID 100 to the first system group).
      # Mounted volumes (PVC, secrets) will be group-owned by GID 100,
      # allowing the acme user to read/write them.
      securityContext:
        runAsNonRoot: true
        fsGroup: 100
      containers:
        - name: acme-gateway
          # Image is set in each overlay via the `images:` field.
          image: acme-gateway
          args:
            - -config
            - /etc/acme-gateway/config.yaml
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # /directory returns 200 OK with the ACME directory JSON when the
          # service is healthy (no dedicated health endpoint exists).
          livenessProbe:
            httpGet:
              path: /directory
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /directory
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # config.yaml from the ConfigMap generated by each overlay.
            - name: config
              mountPath: /etc/acme-gateway/config.yaml
              subPath: config.yaml
              readOnly: true
            # TLS cert and key from the Secret generated by each overlay.
            # The secret keys (tls.crt / tls.key) are remapped via `items` so
            # the filenames match what config.yaml references (server.crt / server.key).
            - name: tls
              mountPath: /etc/acme-gateway/tls
              readOnly: true
            # Persistent SQLite state database.
            - name: data
              mountPath: /var/lib/acme-gateway
            # Writable scratch space (readOnlyRootFilesystem: true requires this).
            - name: tmp
              mountPath: /tmp
      volumes:
        # acme-gateway-config is created by `configMapGenerator` in each overlay.
        - name: config
          configMap:
            name: acme-gateway-config
        # acme-gateway-tls is created by `secretGenerator` in each overlay.
        # Keys tls.crt / tls.key are renamed so paths match config.yaml.
        - name: tls
          secret:
            secretName: acme-gateway-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
        - name: data
          persistentVolumeClaim:
            claimName: acme-gateway-data
        - name: tmp
          emptyDir: {}
