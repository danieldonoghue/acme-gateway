name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write   # create GitHub release + upload assets
  packages: write   # push to GHCR

jobs:
  # ── Run the full test + security suite before releasing ─────────────────────
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race -count=1 ./...
      - run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── Cross-compile binaries ───────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goarch }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o "dist/acme-gateway_linux_${{ matrix.goarch }}" \
            ./cmd/acme-gateway

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goarch }}
          path: dist/acme-gateway_linux_${{ matrix.goarch }}
          if-no-files-found: error

  # ── Package: tarballs + Debian packages ─────────────────────────────────────
  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x dist/acme-gateway_linux_*

      - name: Create tarballs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          for arch in amd64 arm64; do
            dir="dist/acme-gateway_${VERSION}_linux_${arch}"
            mkdir -p "${dir}"
            cp "dist/acme-gateway_linux_${arch}" "${dir}/acme-gateway"
            cp acme-gateway.service README.md config.yaml.example "${dir}/"
            tar -czf "release/acme-gateway_${VERSION}_linux_${arch}.tar.gz" \
              -C dist "acme-gateway_${VERSION}_linux_${arch}"
          done

      - name: Install dpkg tools
        run: sudo apt-get update -qq && sudo apt-get install -qq -y dpkg

      - name: Build Debian packages
        run: |
          chmod +x packaging/build-deb.sh
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading "v" for deb version field
          for arch in amd64 arm64; do
            for debian_ver in 12 13; do
              packaging/build-deb.sh "${VERSION}" "${arch}" "${debian_ver}"
            done
          done
          mv dist/acme-gateway_*.deb release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum * | tee checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  # ── Build and push multi-arch Docker image ───────────────────────────────────
  docker:
    name: Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x dist/acme-gateway_linux_*

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags:  v1.2.3 | 1.2 | 1 | latest (on non-pre-release tags)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub release ────────────────────────────────────────────────────
  release:
    name: Create release
    needs: [package, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
