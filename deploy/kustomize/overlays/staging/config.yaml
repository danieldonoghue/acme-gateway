# acme-gateway configuration — staging environment.
#
# Uses the Let's Encrypt *staging* endpoint. Certificates issued here are NOT
# browser-trusted but otherwise go through the full ACME flow, making staging
# ideal for testing routing rules and connectivity before production.

server:
  listen: ":8443"
  base_url: "https://acme-gateway-staging.example.com"

state:
  db_path: "/var/lib/acme-gateway/state.db"

bootstrap:
  enabled: false
  cert_path: "/etc/acme-gateway/tls/server.crt"
  key_path: "/etc/acme-gateway/tls/server.key"

upstreams:
  letsencrypt-staging:
    directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
    contact_email: "certadmin+staging@example.com"
    account_count: 1

profiles:
  tlsserver: "TLS server certificate via Let's Encrypt staging"

routing:
  rules:
    - match:
        profile: "tlsserver"
      upstream: letsencrypt-staging
      upstream_profile: "tlsserver"
  default_upstream: letsencrypt-staging
