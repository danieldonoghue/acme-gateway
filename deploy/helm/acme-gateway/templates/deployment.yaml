{{- include "acme-gateway.validateTLS" . }}
{{- include "acme-gateway.validateBootstrap" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acme-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate strategy is required: acme-gateway uses a SQLite database which
  # only supports a single writer. A RollingUpdate would allow two Pods to
  # access the database simultaneously, causing lock errors.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "acme-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acme-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the Deployment when the config or dns-hooks ConfigMap changes.
        checksum/config: {{ include "acme-gateway.configYaml" . | sha256sum }}
        {{- if .Values.dnsHooks.enabled }}
        checksum/dns-hooks: {{ (print .Values.dnsHooks.deployScript .Values.dnsHooks.cleanupScript) | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "acme-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: acme-gateway
          image: {{ include "acme-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -config
            - /etc/acme-gateway/config.yaml
          ports:
            - name: {{ if .Values.config.server.tls }}https{{ else }}http{{ end }}
              containerPort: {{ if .Values.config.server.tls }}8443{{ else }}8080{{ end }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- if .httpGet }}
            {{- mergeOverwrite (deepCopy .) (dict "httpGet" (dict "port" (ternary "https" "http" $.Values.config.server.tls) "scheme" (ternary "HTTPS" "HTTP" $.Values.config.server.tls))) | toYaml | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- if .httpGet }}
            {{- mergeOverwrite (deepCopy .) (dict "httpGet" (dict "port" (ternary "https" "http" $.Values.config.server.tls) "scheme" (ternary "HTTPS" "HTTP" $.Values.config.server.tls))) | toYaml | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- if .httpGet }}
            {{- mergeOverwrite (deepCopy .) (dict "httpGet" (dict "port" (ternary "https" "http" $.Values.config.server.tls) "scheme" (ternary "HTTPS" "HTTP" $.Values.config.server.tls))) | toYaml | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Config file (subPath avoids conflicting with the tls mount).
            - name: config
              mountPath: /etc/acme-gateway/config.yaml
              subPath: config.yaml
              readOnly: true
            # TLS certificate and key for the HTTPS listener.
            # In bootstrap mode, /etc/acme-gateway/tls/ maps to a subPath of
            # the data PVC so the obtained cert/key survive Pod restarts.
            # Omitted entirely in external TLS termination mode (config.server.tls: false).
            {{- if .Values.config.bootstrap.enabled }}
            - name: data
              mountPath: /etc/acme-gateway/tls
              subPath: tls
            {{- else if .Values.config.server.tls }}
            - name: tls
              mountPath: /etc/acme-gateway/tls
              readOnly: true
            {{- end }}
            # Persistent SQLite state database.
            - name: data
              mountPath: /var/lib/acme-gateway
            # Writable /tmp for any runtime scratch space.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.dnsHooks.enabled }}
            # DNS hook scripts for bootstrap dns-01 challenge.
            - name: dns-hooks
              mountPath: /etc/acme-gateway/hooks
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "acme-gateway.fullname" . }}-config
        # In bootstrap mode, /etc/acme-gateway/tls/ is served via a subPath
        # of the data PVC (see volumeMount above) — no separate volume needed.
        # For external cert sources, mount the Secret read-only.
        # In external TLS termination mode (config.server.tls: false), omitted.
        {{- if and (not .Values.config.bootstrap.enabled) .Values.config.server.tls }}
        - name: tls
          secret:
            secretName: {{ include "acme-gateway.tlsSecretName" . }}
            # Map Kubernetes TLS secret keys to the names the gateway expects.
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
        {{- end }}
        # SQLite persistent storage.
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "acme-gateway.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.dnsHooks.enabled }}
        - name: dns-hooks
          configMap:
            name: {{ include "acme-gateway.fullname" . }}-dns-hooks
            defaultMode: 0755
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
